name: linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: models
          key: models-linux-${{ hashFiles('scripts/download-models.sh') }}
      - name: Install deps and download models
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 xvfb
          uv sync
          ./scripts/download-models.sh
      - name: Tests
        run: uv run pytest -q -rs --ignore=tests/test_windows.py
      - name: lipflow doctor
        run: uv run lipflow doctor || true
