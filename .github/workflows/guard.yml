name: candidate-and-cleanup-guards
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The headless audio tests exercise real 48 kHz -> 16 kHz resampling.
      - run: python -m pip install pytest requests "numpy<2" "scipy>=1.13,<2"
      - run: python -m pytest -q tests/test_confidence.py tests/test_guard.py
        env:
          LIPFLOW_HOME: /tmp/lipflow-test-data
      - name: Headless Mandarin desktop regressions
        run: python -m pytest -q desktop/mandarin/tests
        env:
          LIPFLOW_HOME: /tmp/lipflow-desktop-test-data
