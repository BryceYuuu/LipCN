[project]
name = "lipflow"
version = "0.1.0"
description = "Wispr Flow, but for your lips: silent dictation from your webcam"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.40",
    "av>=18.1.0",
    "mediapipe==0.10.21",
    "mlx-lm>=0.31.3",
    "numpy<2",
    "opencv-python>=4.9,<4.11",
    "pynput>=1.7.7",
    "pyobjc-framework-avfoundation>=10.3",
    "pyobjc-framework-cocoa>=10.3",
    "pyobjc-framework-quartz>=10.3",
    "requests>=2.31",
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5.6",
    "torch>=2.4",
]

[project.scripts]
lipflow = "lipflow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lipflow", "espnet"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
